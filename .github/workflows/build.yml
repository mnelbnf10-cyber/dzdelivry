name: Build DzDelivery Pro APKs
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            artifact: DzDelivery-Customer-APK
          - app: admin
            artifact: DzDelivery-Admin-APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: apps/${{ matrix.app }}
        run: flutter create --org dz.dzdelivery --project-name dzdelivery_${{ matrix.app }} --platforms=android .
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
